services:
  app:
    build: .
    image: feedback-app:latest
    container_name: feedback-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "3000"
    networks:
      - nginx-proxy
    volumes:
      - launch-data:/app/data

networks:
  nginx-proxy:
    external: true

volumes:
  launch-data:
    name: feedback-app-launch-data
